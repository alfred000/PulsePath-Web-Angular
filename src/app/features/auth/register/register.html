<div class="auth-container">
  <h2>Créer un compte PulsePath</h2>
  
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="email">Adresse Email</label>
      <input id="email" type="email" formControlName="email" placeholder="exemple@pulsepath.com" />
      <div *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid" class="error-msg">
        <small *ngIf="registerForm.get('email')?.errors?.['required']">L'email est obligatoire.</small>
        <small *ngIf="registerForm.get('email')?.errors?.['email']">Format d'email invalide.</small>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" formControlName="password" placeholder="••••••••" />
      <div *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid" class="error-msg">
        <small *ngIf="registerForm.get('password')?.errors?.['required']">Le mot de passe est obligatoire.</small>
        <small *ngIf="registerForm.get('password')?.errors?.['minlength']">Minimum 6 caractères.</small>
      </div>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirmez le mot de passe</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" placeholder="••••••••" />
      <div *ngIf="registerForm.get('confirmPassword')?.touched && registerForm.hasError('mismatch')" class="error-msg">
        <small>Les mots de passe ne correspondent pas.</small>
      </div>
    </div>

    <div *ngIf="errorMessage" class="server-error">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="server-success">{{ successMessage }}</div>

    <button type="submit" [disabled]="registerForm.invalid || isSubmitting">
      {{ isSubmitting ? "Création du compte..." : "S'inscrire" }}
    </button>
  </form>

  <p>Déjà inscrit ? <a routerLink="/login">Connectez-vous ici</a></p>
</div>
